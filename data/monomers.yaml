# OligoLab — Bausteine (Monomere)
#
# Die Werte unter `mass_residue`, `mass_amidite` und `conc_molar` sind
# UNVERAENDERT aus dem bestehenden Excel-Rechner uebernommen und gelten als
# verbindlich (CLAUDE.md, Regel 2). Sie werden hier nicht "korrigiert".
#
# `formula_residue` ist die Summenformel der Kettenbaueinheit, also
# Nukleosid-3'-monophosphat minus Wasser. Sie dient allein der unabhaengigen
# Gegenrechnung in `app/mass_exact.py`. Weicht die daraus berechnete Masse von
# `mass_residue` ab, ist das ein ANZEIGEFALL, keine Korrektur.
#
# `smiles` ist das freie Nukleosid (5'-OH, 3'-OH). Fehlt `formula_residue`,
# wird die Restformel daraus als Nukleosid + HPO3 - H2O abgeleitet.
#
# `core_tested`: ja / nein / unbekannt — ist der Baustein im katalytischen Kern
# des 10-23 erprobt? Wird ab Phase 3 fuer die kritischen Befunde gebraucht.

version: 1
quelle_global: "Excel-Rechner (Bestand), Stand der Uebernahme 2026-10"

# Schutzgruppe je Basenelternteil. Die Massen stehen in protecting_groups.yaml.
# Treibt den Term n_A*104.03 + n_G*70.05 + n_C*42.02 in mass.py, damit auch
# modifizierte Bausteine ueber `base_parent` richtig mitgezaehlt werden.
protecting_group_by_base:
  A: Bz
  C: Ac
  G: iBu
  T: null
  U: null

monomers:
